<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1815">
<title>今日故事</title>
<style>
  :root{
    --bg:#1b1815; --card:#241f1b; --line:#3a322b;
    --text:#f2e9dd; --muted:#b7a696; --dim:#8a7a6b;
    --accent:#e8834a; --accent-2:#f0a06a; --ok:#5aa87e; --bad:#d4695f;
    --fs:19px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow-x:hidden}
  body{
    font-family: system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:var(--fs); line-height:1.88;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(#1b1815 76%, rgba(27,24,21,.88));
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 0 10px;
  }
  .hrow{display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;letter-spacing:.08em;color:var(--accent);border:1px solid rgba(232,131,74,.45);border-radius:999px;padding:2px 9px;flex:none}
  .htitle{font-size:14px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;height:32px;padding:0 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;flex:none}
  .iconbtn:active{transform:scale(.97)}
  .iconbtn.on{border-color:rgba(232,131,74,.6);color:var(--accent-2)}

  .banner{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5}
  .banner.warn{background:rgba(232,131,74,.12);border:1px solid rgba(232,131,74,.35);color:#f6c9a8}
  .banner.done{background:rgba(90,168,126,.12);border:1px solid rgba(90,168,126,.35);color:#cfe9d9}
  .banner span{flex:1}
  .banner button{appearance:none;border:0;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;background:var(--accent);color:#221611;cursor:pointer}

  main{padding-top:16px}
  .lede{font-size:13px;color:var(--dim);letter-spacing:.02em;margin-bottom:16px}
  p.para{margin:0 0 24px;font-size:var(--fs);line-height:1.88;letter-spacing:.01em;border-radius:10px;transition:background .2s}
  p.para.speaking{background:rgba(232,131,74,.08)}
  .w{color:#ffe6c9;font-weight:650;border-bottom:1.5px dotted rgba(232,131,74,.55);cursor:pointer}
  .g{font-size:11.5px;color:var(--muted);font-weight:400;margin:0 3px 0 1px;white-space:nowrap}
  .spk{border:0;background:none;color:var(--dim);font-size:12px;padding:0 2px;cursor:pointer;vertical-align:2px}
  .spk:active{color:var(--accent)}
  body.hidegloss .g{display:none}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(27,24,21,0), #1b1815 34%)}
  .bar .inner{max-width:680px;margin:0 auto}
  .btn{appearance:none;border:0;width:100%;height:56px;border-radius:16px;background:var(--accent);color:#221611;font-size:17px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 24px rgba(232,131,74,.18)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}

  .tmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:6px}
  .track{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:30px}
  .track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .prompt{font-size:15px;color:var(--muted);margin-bottom:12px}
  .bigzh{font-size:30px;line-height:1.5;font-weight:700;margin:0 0 8px}
  .reveal{margin-top:24px;border-top:1px solid var(--line);padding-top:24px}
  .en{font-size:42px;line-height:1.25;font-weight:750;margin:0 0 6px}
  .ipach{color:var(--dim);font-size:15px;font-family:ui-monospace,Menlo,monospace}
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
  .grade{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px 6px;font-size:14.5px;cursor:pointer;line-height:1.3}
  .grade small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .grade:active{transform:scale(.98)}

  .sent{font-size:19px;line-height:2.4;margin:0 0 20px}
  .bl{display:inline-block;min-width:86px;text-align:center;vertical-align:baseline;line-height:1.3;border-bottom:2px solid rgba(232,131,74,.55);color:var(--accent-2);font-weight:650;padding:0 6px;cursor:pointer;margin:0 2px;border-radius:6px 6px 0 0}
  .bl.empty{color:transparent}
  .bl.sel{background:rgba(232,131,74,.16)}
  .bl.done{border-bottom-color:rgba(90,168,126,.8);color:#cfead9}
  .bank{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 6px;margin-top:4px;border-top:1px solid var(--line)}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:pointer}
  .chip.used{opacity:.28;pointer-events:none}
  .chip:active{transform:scale(.97)}

  .score{display:flex;gap:12px;margin:6px 0 26px}
  .sc{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .sc b{display:block;font-size:26px;line-height:1.2}
  .sc span{font-size:12px;color:var(--dim)}
  .wrongbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:22px}
  .wr{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(58,50,43,.7)}
  .wr:last-child{border-bottom:0}
  .wr b{font-size:17px;color:#ffd9b8}
  .wr span{font-size:13.5px;color:var(--muted);flex:1}
  .due{font-size:11.5px;color:var(--dim);white-space:nowrap;flex:none}
  .good{color:var(--ok)}
  .h2{font-size:13px;letter-spacing:.1em;color:var(--dim);margin:26px 0 10px}
  .hint{font-size:12.5px;color:var(--dim);line-height:1.8}

  .sheet{position:fixed;inset:0;z-index:50;background:rgba(10,8,7,.6);display:none;align-items:flex-end}
  .sheet.open{display:flex}
  .sheet .in{width:100%;max-width:680px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .qrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(58,50,43,.7);font-size:14.5px}
  .qrow:last-child{border-bottom:0}
  .qid{font-size:12px;color:var(--accent);border:1px solid rgba(232,131,74,.4);border-radius:6px;padding:1px 6px}
  .qrow .st{margin-left:auto;font-size:12px;color:var(--dim)}
  .qrow.todo{opacity:.5}
  .vrow{display:flex;align-items:center;gap:10px;margin-top:6px}
  .vrow label{font-size:13px;color:var(--muted)}
  select.vsel{flex:1;appearance:none;background:var(--card2,#2b2520);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px}

  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 9px;height:32px;cursor:pointer}
  .seg button.on{background:rgba(232,131,74,.2);color:var(--accent-2);font-weight:700}
  .tools{display:flex;gap:8px;margin:0 0 16px}
  .toolbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .toolbtn.on{color:var(--accent-2);border-color:rgba(232,131,74,.5)}
  .accents{display:flex;gap:10px;margin:12px 0 2px}
  .accbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer}
  .accbtn:active{transform:scale(.97)}
  .zhbox{margin:18px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
  .zhbox summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
  .zhbox summary::-webkit-details-marker{display:none}
  .zhbox summary::before{content:'▸ ';color:var(--accent)}
  .zhbox[open] summary::before{content:'▾ '}
  .zhbox p{margin:10px 0 2px;font-size:15px;line-height:1.8;color:var(--text)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#332b24;color:#f6ecdf;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <span class="badge" id="sbadge">S01</span>
      <span class="htitle" id="stitle">The Last Orbit</span>
      <div class="seg" id="accentSeg">
        <button type="button" data-accent="us" class="on">美音</button>
        <button type="button" data-accent="uk">英音</button>
      </div>
      <button class="iconbtn" id="queueBtn" type="button">队列</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>
<div class="bar"><div class="inner" id="bar"></div></div>

<div class="sheet" id="sheet">
  <div class="in">
    <h3>今日队列</h3>
    <div class="sub" id="qsub"></div>
    <div id="qlist"></div>
    <div class="hint" style="margin-top:8px">右上角「美音 / 英音」切换口音；手机没装对应语音包时会退回另一种。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ───────────────────────── 状态 ───────────────────────── */
const BUILD = '2026-10-29 · v4 · 10 篇';
const KEY = 'vs.story.v2';
const store = {
  failed:false,
  read(){
    try { return JSON.parse(localStorage.getItem(KEY)) || {days:{}}; } catch { return {days:{}}; }
  },
  write(o){
    try { localStorage.setItem(KEY, JSON.stringify(o)); }
    catch { this.failed = true; }
  }
};
const db = store.read();
db.days = db.days || {};
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today(){
  const k = dayKey();
  db.days[k] = db.days[k] || {done:[], results:{}};
  return db.days[k];
}
function save(){ store.write(db); }

const state = {
  view:'read',
  story:null,
  showGloss:true,
  aIndex:0, aResults:[], revealed:false,
  bAnswers:{}, bSel:null, bank:null,
  drill:null,
  speaking:false
};

/* ───────────────────────── 发音 ───────────────────────── */
let voices = [];
function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices() || [];
}
loadVoices();
if ('speechSynthesis' in window) window.speechSynthesis.addEventListener?.('voiceschanged', loadVoices);
function enVoices(){
  if (!voices.length) loadVoices();
  return voices.filter(v => /^en(-|_)/i.test(v.lang));
}
function accentOf(){ return db.accent === 'uk' ? 'uk' : 'us'; }
function voiceFor(accent){
  const list = enVoices();
  if (!list.length) return null;
  const tag = accent === 'uk' ? /en[-_]GB/i : /en[-_]US/i;
  const prefer = accent === 'uk'
    ? /libby|sonia|ryan|hazel|george|kate|serena|google uk english/i
    : /aria|jenny|zira|samantha|david|guy|michelle|google us english/i;
  return list.find(v => tag.test(v.lang) && prefer.test(v.name))
      || list.find(v => tag.test(v.lang))
      || list.find(v => prefer.test(v.name))
      || list[0];
}
function utter(text, rate, accent){
  const u = new SpeechSynthesisUtterance(String(text));
  const v = voiceFor(accent || accentOf());
  if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = accent === 'uk' ? 'en-GB' : 'en-US'; }
  u.rate = rate || 0.9; u.pitch = 1; u.volume = 1;
  return u;
}
function speak(word, accent){
  if (!('speechSynthesis' in window)){ toast('这个浏览器没有语音合成，先看音标吧'); return; }
  try {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter(word, 0.88, accent || accentOf()));
  } catch { toast('这台设备没装英语语音包，发音跳过'); }
}
function stopSpeech(){
  state.speaking = false;
  document.querySelectorAll('p.para.speaking').forEach(p => p.classList.remove('speaking'));
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

/* ───────────────────────── 小工具 ───────────────────────── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function glossOf(story, key){
  const w = story.words[key];
  if (!w) return '';
  if (w.short) return w.short;
  return w.senses.filter(s => s.zh).map((s,i,arr) => arr.length>1 ? (i+1)+'. '+s.pos+' '+s.zh : s.pos+' '+s.zh).join('　');
}
function datePlus(n){ const d = new Date(); d.setDate(d.getDate()+n); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }

/* ───────────────────────── 今日进度 ───────────────────────── */
function progress(){
  const t = today();
  const done = t.done.filter(id => STORIES.some(s => s.id === id));
  return { done, words: done.length * 20, need: Math.max(0, GOAL_STORIES - done.length) };
}
function nextStory(){
  const c = db.cursor || 0;
  return c < STORIES.length ? STORIES[c] : null;
}

/* ───────────────────────── 顶栏 ───────────────────────── */
function paintHead(story){
  $('#sbadge').textContent = story ? story.id : '✓';
  $('#stitle').textContent = story ? story.title : '今日已完成';
}

/* ───────────────────────── 阅读 ───────────────────────── */

  const p = progress();

    ? '<div class="banner warn"><span>今天还差 <b>' + p.need + '</b> 篇（' + (p.need*20) + ' 词）就满 100。已完成 ' + p.done.length + '/' + GOAL_STORIES + ' 篇。</span></div>'
    : '<div class="banner done"><span>今日已达标：' + p.words + '/100 词（' + p.done.length + ' 篇）。想加练可以继续。</span></div>';

  const body = story.paras.map(para => '<p class="para">' + para.replace(/\{([A-Za-z]+)\}/g, (_, k) =>
    '<span class="w" data-w="' + k + '">' + k + '</span>' +

    '</div>' +
    '<div class="lede">' + esc(story.meta) + ' · 点词听发音（口音看右上角）</div>' +
    body +
    '<div class="hint">' + (p.need > 0 ? '读完这篇还有 ' + (p.need-1) + ' 篇。' : '今日任务完成，剩下的时间算加练。') + '</div>';

  $('#listenBtn').onclick = onListen;
  $('#glossBtn').onclick = () => { state.showGloss = !state.showGloss; renderRead(story); };

  $('#bar').innerHTML = '<button class="btn" id="goTest">读完了，考我 →</button>';
  $('#goTest').onclick = () => { state.aIndex = 0; state.aResults = []; state.revealed = false; state.bAnswers = {}; state.bSel = null; state.bank = null; renderTestA(story); };
}

/* ───────────────────────── 卡片回忆 ───────────────────────── */
function renderTestA(story, list){
  state.view = 'testA';
  document.body.classList.add('hidegloss');

  const [word, zh] = cards[state.aIndex];

    '<div class="track"><i style="width:' + (state.aIndex/total*100) + '%"></i></div>' +
    '<div class="prompt">看到中文，回忆那个英文词：</div>' +
    '<h1 class="bigzh">' + esc(zh) + '</h1>' +
    (state.revealed
      ? '<div class="reveal">' +
          '<div class="en">' + esc(word) + '</div>' +
          '<div class="accents">' +
            '<button class="accbtn" data-spk="' + word + '" data-accent="us">🔊 美音</button>' +
            '<button class="accbtn" data-spk="' + word + '" data-accent="uk">🔊 英音</button>' +
          '</div>' +
          (story.words[word] && story.words[word].ipa ? '<div class="ipach">' + esc(story.words[word].ipa) + '</div>' : '') +
          '<div class="grades">' +
            '<button class="grade" data-g="forgot">😵 忘了<small>+1 天复习</small></button>' +
            '<button class="grade" data-g="fuzzy">🤔 模糊<small>+3 天复习</small></button>' +
            '<button class="grade" data-g="known">😎 记得<small>+7 天复习</small></button>' +
          '</div>' +
        '</div>'
      : '<div class="reveal" style="border:0;padding-top:6px"><button class="btn ghost" id="revealBtn" style="height:52px">显示答案</button></div>');

  $('#bar').innerHTML = '<div class="hint" style="text-align:center">' + (state.revealed ? '诚实一点，选一个' : '想不起来也没关系，翻看答案') + '</div>';

  if (!state.revealed){
    $('#revealBtn').onclick = () => { state.revealed = true; renderTestA(story, list); };
  } else {
    document.querySelectorAll('.grade').forEach(b => {
      b.onclick = () => {
        state.aResults.push(b.dataset.g);
        state.revealed = false;
        state.aIndex++;
        if (state.aIndex >= cards.length){
          if (list) return renderDrillResult(story, cards);
          return renderTestB(story);
        }
        renderTestA(story, list);
      };
    });
  }
}

/* ───────────────────────── 句子填空 ───────────────────────── */
function renderTestB(story){
  state.view = 'testB';
  document.body.classList.add('hidegloss');
  const blanks = [];
  story.fills.forEach((f,i) => f.a.forEach((_,j) => blanks.push(i+':'+j)));
  if (!state.bank) state.bank = story.cards.map(c => c[0]).slice().sort(() => Math.random() - 0.5);

  const html = story.fills.map((f,i) =>
    '<p class="sent">' + f.text.replace(/\{(\d)\}/g, (_,j) => {
      const k = i+':'+j, v = state.bAnswers[k];
      const cls = 'bl' + (v ? ' done' : ' empty') + (state.bSel === k ? ' sel' : '');
      return '<span class="' + cls + '" data-blank="' + k + '">' + (v ? esc(v) : '&nbsp;&nbsp;&nbsp;') + '</span>';
    }) + '</p>').join('');

  $('#view').innerHTML =
    '<div class="tmeta"><span>句子填空 · ' + blanks.length + ' 空</span><span>点空位，再点词</span></div>' +
    '<div class="track"><i style="width:' + (Object.keys(state.bAnswers).length/blanks.length*100) + '%"></i></div>' +
    html +
    '<div class="h2">词块（点一个空，再点一个词）</div>' +
    '<div class="bank">' + state.bank.map(w =>
      '<button class="chip' + (Object.values(state.bAnswers).includes(w) ? ' used' : '') + '" data-chip="' + w + '">' + w + '</button>'
    ).join('') + '</div>';

  $('#bar').innerHTML = '<button class="btn" id="submitB">提交答案</button>';

  document.querySelectorAll('[data-blank]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.blank;
      if (state.bAnswers[k]) delete state.bAnswers[k];
      state.bSel = (state.bSel === k) ? null : k;
      renderTestB(story);
    };
  });
  document.querySelectorAll('[data-chip]').forEach(el => {
    el.onclick = () => {
      if (!state.bSel){ toast('先点一个空位，再点词'); return; }
      state.bAnswers[state.bSel] = el.dataset.chip;
      state.bSel = null;
      renderTestB(story);
    };
  });
  $('#submitB').onclick = () => gradeB(story);
}

/* ───────────────────────── 判分 ───────────────────────── */
function gradeB(story){
  let right = 0; const wrong = [];
  story.fills.forEach((f,i) => f.a.forEach((ans,j) => {
    const got = state.bAnswers[i+':'+j] || '';
    if (got.toLowerCase() === ans.toLowerCase()) right++;
    else wrong.push(ans);
  }));
  const total = story.fills.reduce((n,f) => n + f.a.length, 0);

  const forgot = story.cards.filter((_,i) => state.aResults[i] === 'forgot').map(c => c[0]);
  const fuzzy  = story.cards.filter((_,i) => state.aResults[i] === 'fuzzy').map(c => c[0]);
  const known  = story.cards.filter((_,i) => state.aResults[i] === 'known').map(c => c[0]);

  const bad = [...new Set([...forgot, ...fuzzy, ...wrong])];
  const plan = bad.map(w => ({w, d: forgot.includes(w) ? 1 : (fuzzy.includes(w) ? 3 : 1)}))
                  .sort((a,b) => a.d - b.d);

  const t = today();
  if (!t.done.includes(story.id)) t.done.push(story.id);
  const idx = STORIES.findIndex(x => x.id === story.id);
  if (idx >= 0 && idx + 1 > (db.cursor || 0)) db.cursor = idx + 1;
  t.results[story.id] = { at:Date.now(), known, forgot, fuzzy, right, total, plan };

  // 跨天复习池：错词按 1/3/7 天排期
  db.plan = db.plan || [];
  plan.forEach(p => db.plan.push({w:p.w, story:story.id, due:dayKey(new Date(Date.now()+p.d*86400000))}));
  save();

  const p = progress();
  state.view = 'result';
  $('#view').innerHTML =
    '<div class="h2" style="margin-top:0">这篇的结果</div>' +
    '<div class="score">' +
      '<div class="sc"><b>' + known.length + '<small style="font-size:14px;color:#8a7a6b">/20</small></b><span>卡片「记得」</span></div>' +
      '<div class="sc"><b>' + right + '<small style="font-size:14px;color:#8a7a6b">/' + total + '</small></b><span>填空正确</span></div>' +
    '</div>' +
    (plan.length
      ? '<div class="h2">要复习的词（' + plan.length + '）</div><div class="wrongbox">' +
        plan.map(x => '<div class="wr"><b>' + x.w + '</b><span>' + esc(glossOf(story,x.w)) + '</span><span class="due">' + x.d + ' 天后 · ' + datePlus(x.d) + '</span></div>').join('') +
        '</div>'
      : '<div class="h2">全对</div><div class="wrongbox"><div class="wr"><span class="good">这篇没有错词。</span></div></div>') +
    (story.zh ? '<details class="zhbox"><summary>中文大意（做完才解锁喵）</summary><p>' + esc(story.zh) + '</p></details>' : '') +
    '<div class="banner ' + (p.need > 0 ? 'warn' : 'done') + '"><span>' +
      (p.need > 0 ? '今日 ' + p.words + '/100 词，还差 ' + p.need + ' 篇。' : '今日已达标 ' + p.words + '/100 词。') +
    '</span></div>' +
    '<div class="hint">复习日期已记在这台设备上。明天打开先做到期词。</div>';

  const nxt = nextStory();
  $('#bar').innerHTML = nxt
    ? '<button class="btn" id="nextStory">继续：' + nxt.id + ' ' + esc(nxt.title) + ' →</button>'
    : '<button class="btn" id="drill">加练今天错的词</button>';
  if (nxt) $('#nextStory').onclick = () => { resetRun(); renderRead(nxt); };
  else $('#drill').onclick = () => startDrill();
}

/* ───────────────────────── 加练（超额 100 词之后） ───────────────────────── */
function startDrill(){
  const t = today();
  const words = [];
  Object.values(t.results).forEach(r => (r.plan||[]).forEach(p => { if (!words.includes(p.w)) words.push(p.w); }));
  if (!words.length){ toast('今天没有错词，明天见'); return; }
  const story = STORIES.find(s => s.id === (t.done[t.done.length-1])) || STORIES[0];
  const list = words.map(w => {
    const c = story.cards.find(c => c[0] === w);
    return c || [w, glossOf(story, w)];
  });
  state.aIndex = 0; state.aResults = [];
  renderTestA(story, list);
}
function renderDrillResult(story, cards){
  const forgot = cards.filter((_,i) => state.aResults[i] === 'forgot').length;
  const known = cards.length - forgot;
  state.view = 'result';
  $('#view').innerHTML =
    '<div class="h2" style="margin-top:0">加练完成</div>' +
    '<div class="score"><div class="sc"><b>' + known + '<small style="font-size:14px;color:#8a7a6b">/' + cards.length + '</small></b><span>记得</span></div></div>' +
    '<div class="hint">加练不计入今日 100 词，只影响记忆调度。</div>';
  $('#bar').innerHTML = '<button class="btn ghost" id="back">回到故事</button>';
  $('#back').onclick = () => { const s = nextStory() || STORIES[0]; resetRun(); renderRead(s); };
}

/* ───────────────────────── 收尾 / 队列 ───────────────────────── */
function resetRun(){
  state.aIndex = 0; state.aResults = []; state.revealed = false;
  state.bAnswers = {}; state.bSel = null; state.bank = null;
}
function renderQueue(){

  }).join('');
  const p = progress();
  $('#qsub').textContent = dayKey() + ' · 今日 ' + p.words + '/100 词 · 库里还有 ' + Math.max(0, STORIES.length - c) + ' 篇 · ' + BUILD;
}

$('#queueBtn').onclick = () => { renderQueue(); $('#sheet').classList.add('open'); };

/* 朗读：整篇逐句读，读哪段就亮哪段 */
function onListen(){
  if (state.view !== 'read'){ toast('先回到故事页'); return; }
  const btn = $('#listenBtn');
  if (state.speaking){ stopSpeech(); if (btn) btn.classList.remove('on'); return; }
  if (!('speechSynthesis' in window)){ toast('这个浏览器没有语音合成'); return; }
  state.speaking = true;
  if (btn) btn.classList.add('on');
  const story = state.story;
  const paras = story.paras.map(p => p.replace(/\{[A-Za-z]+\}/g, w => w.slice(1,-1)));
  const nodes = document.querySelectorAll('p.para');
  let pi = 0;
  function nextPara(){
    if (!state.speaking || pi >= paras.length){ stopSpeech(); if ($('#listenBtn')) $('#listenBtn').classList.remove('on'); return; }
    if (!nodes[pi]) { stopSpeech(); return; }
    nodes.forEach(n => n.classList.remove('speaking'));
    nodes[pi].classList.add('speaking');
    const sentences = paras[pi].split(/(?<=[.!?])\s+/).filter(Boolean);
    let si = 0;
    function nextSent(){
      if (!state.speaking || si >= sentences.length){ pi++; nextPara(); return; }
      const u = utter(sentences[si], 0.95, accentOf());
      u.onend = () => { si++; setTimeout(nextSent, 180); };
      window.speechSynthesis.speak(u);
    }
    nextSent();
  }
  window.speechSynthesis.cancel();
  nextPara();
}

}
document.querySelectorAll('#accentSeg button').forEach(b => {
  b.onclick = () => { db.accent = b.dataset.accent; save(); paintAccent(); speak(b.dataset.accent === 'uk' ? 'This is British English.' : 'This is American English.', b.dataset.accent); };
});

/* 事件委托：点词 / 喇叭发音；点段末喇叭整段读 */
document.addEventListener('click', (e) => {
  const spk = e.target.closest('[data-spk]');
  if (spk){ e.stopPropagation(); speak(spk.dataset.spk, spk.dataset.accent); return; }
  const w = e.target.closest('.w');
  if (w && state.view === 'read') speak(w.dataset.w, accentOf());
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeech(); });

/* 库里没有新故事了 */
function renderDone(){
  state.view = 'done';
  paintHead(null);
  const p = progress();
  const t = today();
  const rows = Object.keys(t.results).map(id => {
    const r = t.results[id]; const st = STORIES.find(x => x.id === id);
    return '<div class="wr"><b>' + id + '</b><span>' + (st ? st.title : '') + ' · 记得 ' + ((r.known||[]).length) + '/20 · 填空 ' + r.right + '/' + r.total + '</span></div>';
  }).join('') || '<div class="wr"><span>今天还没有记录。</span></div>';
  $('#view').innerHTML =
    (story.zh ? '<details class="zhbox"><summary>中文大意（做完才解锁喵）</summary><p>' + esc(story.zh) + '</p></details>' : '') +
    '<div class="banner ' + (p.need > 0 ? 'warn' : 'done') + '"><span>' +
      (p.need > 0 ? '今天已读 ' + p.words + '/100 词。后面的故事还没写进来。' : '今日已达标：' + p.words + '/100 词，' + GOAL_STORIES + ' 篇。') +
    '</span></div>' +
    '<div class="h2">故事读完了喵</div>' +
    '<div class="hint">这一批故事都做过了。新的 5 篇要我写好、上传后才会出现喵；在那之前可以加练今天错的词。</div>' +
    '<div class="wrongbox" style="margin-top:18px">' + rows + '</div>';
  $('#bar').innerHTML = '<button class="btn" id="drill">加练今天错的词</button>';
  $('#drill').onclick = () => startDrill();
}

/* 老版本升级上来：按今天已经做完的篇数把游标补上，避免重复读第一篇 */
if (typeof db.cursor !== 'number'){
  const doneToday = today().done || [];
  const last = doneToday[doneToday.length - 1];
  const i = last ? STORIES.findIndex(x => x.id === last) : -1;
  db.cursor = i >= 0 ? i + 1 : 0;
  save();
}

/* 启动 */
const first = nextStory();
if (first){ renderRead(first); }
else { renderDone(); }
</script>
</body>
</html>
